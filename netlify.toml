# ─────────────────────────────────────────────────────────────
# netlify.toml — Flow PWA
# Drop this file in the ROOT of your repository.
# ─────────────────────────────────────────────────────────────

# ── Build settings ───────────────────────────────────────────
[build]
  # Your site is a static single-file app — no build step needed.
  # If you add a bundler (Vite, Parcel, etc.) later, set:
  #   command = "npm run build"
  #   publish = "dist"
  publish = "."          # serve files from the repo root

# ── Single-Page App routing ──────────────────────────────────
# Without this, refreshing any path like /settings returns 404.
# The rule rewrites every path back to index.html so the JS
# router handles it client-side.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security & PWA headers ───────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Stop MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # Basic XSS protection for older browsers
    X-XSS-Protection = "1; mode=block"
    # Only send referrer on same-origin requests
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Required for PWA install prompt & service worker scope
    # (Netlify HTTPS satisfies the secure-context requirement)

# Service worker — must NOT be cached by the browser long-term
# so updates propagate immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Manifest — short cache, always fresh
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Static icons — long cache (content doesn't change often)
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# HTML — never cache; Netlify CDN handles delivery
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
